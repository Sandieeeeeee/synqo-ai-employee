<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Synqo AI Employee</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,#182052,#050816 58%);color:#fff;font-family:Segoe UI,Arial,sans-serif}.card{text-align:center;padding:42px;max-width:520px}.logo{width:84px;height:84px;margin:auto;border-radius:24px;display:grid;place-items:center;font-size:44px;font-weight:800;background:linear-gradient(145deg,#6c5ce7,#2aa8f2);box-shadow:0 18px 60px #5d5ce755}h1{margin:24px 0 10px;font-size:34px}p{color:#b5bed7;line-height:1.6}.loader{width:180px;height:4px;margin:28px auto 0;border-radius:10px;overflow:hidden;background:#ffffff18}.loader:after{content:"";display:block;width:45%;height:100%;background:#59c8ff;animation:load 1.2s ease-in-out infinite}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
  </style>
</head>
<body><main class="card"><div class="logo">S</div><h1>Synqo AI Employee</h1><p>Opening your intelligent business workspace…<br>Internet access is required.</p><div class="loader"></div></main></body>
</html>
